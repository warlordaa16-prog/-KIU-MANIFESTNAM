<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 12" opacity="0.6" />
  
  <!-- Central Emblem: Cross & Fellowship Flame -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Post -->
    <rect x="232" y="120" width="48" height="280" rx="14" fill="url(#goldGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="140" y="210" width="232" height="48" rx="14" fill="url(#goldGrad)" />
    <!-- Holy Spirit Flame on Top -->
    <path d="M256 80 C276 115 285 135 256 165 C227 135 236 115 256 80 Z" fill="#fbbf24" />
  </g>
  <!-- Accent Stars / Rays -->
  <circle cx="256" cy="234" r="18" fill="#ffffff" opacity="0.9" />
</svg>
